      }
      msg.textContent='Saved '+S.doc.pages.length+' pages'+(skipped.length?' Website image skipped for page '+skipped.join(', ')+'.':'')+(pngWeb?' This browser saved the website image as PNG.':'');
    }catch(err){ msg.innerHTML='<span class="note warn">Export failed. If you used an image from another website, re-upload it from your computer.</span>'; }
    btn.disabled=false;
  };
  $('#xBundle',m).onclick=async()=>{
    const btn=$('#xBundle',m); btn.disabled=true; msg.textContent='Rendering…';
    try{
      const page=S.doc.pages[S.doc.page];
      const issue=webExportIssues(page);
      if(issue.blocked.length){ msg.innerHTML=`<span class="note warn">${esc(webBlockMessage(issue))}</span>`; btn.disabled=false; return; }
      if(issue.empty){ msg.innerHTML=`<span class="note warn">${esc(webEmptyMessage())}</span>`; btn.disabled=false; return; }
      const stem=slug($('#xName',m).value);
      const web=await renderWebBlob(page); const ext=web.ext;
      const txt=[
        'HEADLINE: '+slotText('headline','title'),
        'DEK: '+slotText('dek','sub','summary'),
        'LOCATION: '+slotText('location','city'),
        'CATEGORY: '+slotText('category'),
        'TAGS: '+slotText('tag'),
        'SOURCE: '+slotText('source','credit').replace(/^source:\s*/i,''),
        'IMAGE: '+stem+'.'+ext,
        'DATE: '+new Date().toISOString().slice(0,10),
      ].join('\n')+'\n';
      const r1=await saveFile(stem+'.'+ext,web.blob);
      if(r1===false){ webPrev.src=URL.createObjectURL(web.blob); fallback(web.blob,stem+'.'+ext); msg.innerHTML+=`<br><br>Article text:<br><textarea class="inp" rows="7" readonly id="xTxt">${esc(txt)}</textarea>`; btn.disabled=false; return; }
      if(r1==='declined'){ btn.disabled=false; msg.textContent=''; return; }
      await saveFile(stem+'.txt',new Blob([txt],{type:'text/plain'}));
      msg.textContent=`Saved ${stem}.${ext} and ${stem}.txt`+(ext==='png'?' (this browser can\'t make WebP)':'');
    }catch(err){ msg.innerHTML='<span class="note warn">Export failed. Try again, or download the image on its own.</span>'; }
    btn.disabled=false;
  };
  $('#xCopy',m).onclick=async()=>{
    try{
      if(!window.ClipboardItem||!navigator.clipboard?.write) throw 0;
      await navigator.clipboard.write([new ClipboardItem({'image/png':renderBlob('png',1,scale)})]);
      msg.textContent='Copied. Paste it into Instagram, Slack or anywhere that takes images.';
    }catch(e){ msg.textContent='Copying images isn\'t allowed here. Use Download instead.'; }
  };
}

/* ---------- toast ---------- */
let toastT=0;
function toast(t,err){ let el=$('#toast'); if(!el){ el=document.createElement('div'); el.id='toast'; el.setAttribute('role','status'); document.body.appendChild(el); } el.className='toast'+(err?' err':''); el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{el.hidden=true;},err?4500:2200); }

/* ---------- backend ----------
   Two modes, picked at boot:
   • "server": talks to the Next.js routes under /api/scoop (or window.SCOOP_API).
   • "local":  no server reachable, so templates/assets live in this browser's IndexedDB.
   The rest of the app only sees cap.db / cap.assets / cap.downloads / cap.sample,
   so swapping storage later (Sanity, Supabase…) means rewriting this block only. */
const API = String(window.SCOOP_API ?? '/api/scoop').replace(/\/$/,'');
const Backend = { mode:'local', fetchFile:null };

function getPass(){ try{ return localStorage.getItem('scoop-builder:pass')||''; }catch(e){ return ''; } }
function askPass(wrong){
  return new Promise(res=>{
    const m=openModal(`<h2>Team passcode</h2><div class="note">${wrong?'That passcode didn\'t work. ':''}Enter the SLC Scoop team passcode to use the shared library.</div>
      <input class="inp" id="pcIn" type="password" autocomplete="current-password" aria-label="Team passcode">
      <div class="acts"><button class="btn" id="pcNo">Work offline</button><button class="btn primary" id="pcYes">Unlock</button></div>`);
    const go=()=>{ const v=$('#pcIn',m).value.trim(); try{ localStorage.setItem('scoop-builder:pass',v); }catch(e){} closeModal(); res(!!v); };
    $('#pcYes',m).onclick=go; $('#pcIn',m).addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
    $('#pcNo',m).onclick=()=>{ closeModal(); res(false); };
    $('#pcIn',m).focus();
  });
}
let passTries=0;
async function api(path,opts={}){
  const headers=Object.assign({},opts.headers||{}); const p=getPass(); if(p) headers['x-scoop-pass']=p;
  const r=await fetch(API+path,Object.assign({},opts,{headers}));
  if(r.status===401){
    if(passTries++<3 && await askPass(!!p)) return api(path,opts);
    throw {code:'unauthorized'};
  }
  passTries=0;
  if(!r.ok){ let j={}; try{ j=await r.json(); }catch(e){} throw Object.assign({code:'http_'+r.status,status:r.status},j); }
  return (r.headers.get('content-type')||'').includes('json') ? r.json() : r;
}

/* IndexedDB for local mode */
let ldbP=null;
function ldb(){ if(!ldbP) ldbP=new Promise((res,rej)=>{ const r=indexedDB.open('scoop-standalone',1); r.onupgradeneeded=()=>{ r.result.createObjectStore('docs'); r.result.createObjectStore('files'); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); return ldbP; }
async function ltx(store,mode,fn){ const d=await ldb(); return new Promise((res,rej)=>{ const t=d.transaction(store,mode); const out=fn(t.objectStore(store)); t.oncomplete=()=>res(out&&'result' in out?out.result:undefined); t.onerror=()=>rej(t.error); }); }
const fileUrlCache=new Map();
async function localFileUrl(id){ if(fileUrlCache.has(id)) return fileUrlCache.get(id); const b=await ltx('files','readonly',s=>s.get(id)); if(!b) return ''; const u=URL.createObjectURL(b); fileUrlCache.set(id,u); return u; }

/* collection store with snapshot listeners (polled in server mode) */
function makeDb(){
  const subs=new Map(), cache=new Map();
  async function fetchCol(col){
    if(Backend.mode==='server') return await api('/store/'+col);
    const all=await ltx('docs','readonly',s=>s.getAll());
    const docs=(all||[]).filter(d=>d.col===col).map(d=>Object.assign({id:d.id},d.data));
    if(col==='library') for(const d of docs) if(String(d.url).startsWith('idb:')) d.displayUrl=await localFileUrl(d.url.slice(4));
    return docs;
  }
  function emit(col){ const docs=cache.get(col)||[]; for(const s of subs.get(col)||[]) s.cb({docs:docs.map(d=>({id:d.id,exists:true,data:()=>{ const o=Object.assign({},d); delete o.id; return o; }}))}); }
  async function refresh(col){ try{ cache.set(col,await fetchCol(col)); emit(col); }catch(e){ for(const s of subs.get(col)||[]) s.err&&s.err(e); } }
  function sub(col,cb,err){ if(!subs.has(col)) subs.set(col,new Set()); const o={cb,err}; subs.get(col).add(o); refresh(col); return ()=>subs.get(col).delete(o); }
  async function put(col,id,data){
    if(Backend.mode==='server') await api(`/store/${col}/${id}`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(data)});
    else await ltx('docs','readwrite',s=>s.put({col,id,data},col+'/'+id));
    refresh(col);
  }
  async function remove(col,id){
    if(Backend.mode==='server') await api(`/store/${col}/${id}`,{method:'DELETE'});
    else await ltx('docs','readwrite',s=>s.delete(col+'/'+id));
    refresh(col);
  }
  setInterval(()=>{ if(Backend.mode==='server' && document.visibilityState==='visible') for(const col of subs.keys()) refresh(col); },20000);
  document.addEventListener('visibilitychange',()=>{ if(Backend.mode==='server' && document.visibilityState==='visible') for(const col of subs.keys()) refresh(col); });
  return {
    collection:col=>({ onSnapshot:(cb,err)=>sub(col,cb,err), add:async data=>{ const id=Date.now().toString(36)+uid(); await put(col,id,data); return {id}; } }),
    doc:path=>{ const [col,id]=path.split('/'); return {
      set:data=>put(col,id,data), delete:()=>remove(col,id),
      onSnapshot:(cb,err)=>sub(col,snap=>{ const d=snap.docs.find(x=>x.id===id); cb({exists:!!d,data:()=>d?d.data():undefined}); },err),
    }; },
  };
}

const MAX_ASSET_BYTES=25*1024*1024;
async function readBlobJson(res){
  const text=await res.text(); let data={};
  try{ data=text?JSON.parse(text):{}; }catch(e){}
  const msg=typeof data.error==='string'?data.error:(data.error&&data.error.message)||'';
  if(!res.ok){
    if(res.status===413||/too large|maximum size/i.test(String(msg))) throw {code:'too_large'};
    throw {code:'upload_failed',status:res.status,error:msg||'upload_failed'};
  }
  return data;
}
async function putBlob(pathname,file,clientToken,multipart){
  const storeId=clientToken.split('_')[3]||'';
  const type=file.type||'application/octet-stream';
  const headers={
    authorization:'Bearer '+clientToken,
    'x-vercel-blob-store-id':storeId,
    'x-api-version':'12',
    'x-vercel-blob-access':'public',
    'x-content-type':type,
  };
  const root='https://vercel.com/api/blob';
  const q='?pathname='+encodeURIComponent(pathname);
  if(!multipart){
    return readBlobJson(await fetch(root+'/'+q,{method:'PUT',headers:Object.assign({'x-content-length':String(file.size)},headers),body:file}));
  }
  const created=await readBlobJson(await fetch(root+'/mpu'+q,{method:'POST',headers:Object.assign({'x-mpu-action':'create'},headers)}));
  const partSize=8*1024*1024, parts=[];
  for(let start=0,n=1; start<file.size; start+=partSize,n++){
    const chunk=file.slice(start,Math.min(start+partSize,file.size));
    const uploaded=await readBlobJson(await fetch(root+'/mpu'+q,{method:'POST',headers:Object.assign({
      'x-mpu-action':'upload','x-mpu-key':encodeURIComponent(created.key),'x-mpu-upload-id':created.uploadId,
      'x-mpu-part-number':String(n),'x-content-length':String(chunk.size),
    },headers),body:chunk}));
    parts.push({etag:uploaded.etag,partNumber:n});
  }
  return readBlobJson(await fetch(root+'/mpu'+q,{method:'POST',headers:Object.assign({
    'x-mpu-action':'complete','x-mpu-key':encodeURIComponent(created.key),'x-mpu-upload-id':created.uploadId,
    'content-type':'application/json',
  },headers),body:JSON.stringify(parts)}));
}
function makeAssets(){
  return {
    async upload(blob){
      if(blob.size>MAX_ASSET_BYTES) throw {code:'too_large'};
      if(Backend.mode==='server'){
        const name=(blob.name||'file').replace(/[^\w.\-]+/g,'-').slice(0,80);
        const pathname='scoop/assets/'+name;
        const multipart=blob.size>4.5*1024*1024;
        const issued=await api('/assets',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:'blob.generate-client-token',payload:{pathname,clientPayload:null,multipart}})});
        if(!issued||!issued.clientToken) throw {code:'upload_failed'};
        const saved=await putBlob(pathname,blob,issued.clientToken,multipart);
        return {id:saved.pathname,url:saved.url,contentType:saved.contentType||blob.type||'application/octet-stream'};
      }
      const id='f_'+uid(); await ltx('files','readwrite',s=>s.put(blob,id));
      return {id,url:'idb:'+id,contentType:blob.type};
    },
    async delete(url){
      if(Backend.mode==='server') return api('/assets?url='+encodeURIComponent(url),{method:'DELETE'});
      if(String(url).startsWith('idb:')) await ltx('files','readwrite',s=>s.delete(url.slice(4)));
    },
  };
}

/* Fetch an asset as a Blob. Server mode goes through /file so canvas export never hits CORS. */
Backend.fetchFile = async url=>{
  if(!url) throw new Error('no url');
  if(String(url).startsWith('idb:')){ const b=await ltx('files','readonly',s=>s.get(url.slice(4))); if(!b) throw new Error('missing'); return b; }
  const r = Backend.mode==='server' && /^https?:/.test(url) ? await api('/file?u='+encodeURIComponent(url)) : await fetch(url);
  if(!r.ok) throw new Error('fetch '+r.status); return await r.blob();
};

const downloadsLocal = { async save({filename,data}){
  const blob = data instanceof Blob ? data : new Blob([data]);
  const u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000); return {status:'saved'};
}};

const draftApi = { async draft(body,signal){
  if(Backend.mode!=='server') throw {code:'not_configured'};
  try{ return await api('/draft',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal}); }
  catch(e){ if(e?.status===429) throw {code:'rate_limited'}; if(e?.status===503) throw {code:'not_configured'}; throw e; }
}};

async function initBackend(){
  try{ await api('/store/brand'); Backend.mode='server'; }
  catch(e){ Backend.mode='local'; if(e?.code==='unauthorized'){ toast('Working offline: templates and assets stay in this browser.',true); } }
  const db=makeDb();
  Object.assign(cap,{db,assets:makeAssets(),downloads:downloadsLocal,sample:Backend.mode==='server'?draftApi:null,me:''});
  if(Backend.mode==='local') document.title='SLC Scoop Post Builder (offline)';
  let got=0; const timer=setTimeout(()=>{ if(!cap.ready){ cap.failed=true; renderLib(); } },10000);
  const done=()=>{ if(++got>=2){ clearTimeout(timer); cap.ready=true; cap.failed=false; } };
  db.collection('library').onSnapshot(snap=>{
    LIB=snap.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    done(); loadCustomFonts(); renderLib(); if(S.tabR==='layer') renderProps(true);
  },()=>{ done(); cap.failed=true; renderLib(); });
  db.collection('templates').onSnapshot(snap=>{
    TPLS=snap.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    done(); renderLib();
  },()=>{ done(); cap.failed=true; renderLib(); });
  db.doc('brand/settings').onSnapshot(s=>{ const d=s.exists?s.data():null; SWATCH=(d&&Array.isArray(d.swatches))?d.swatches:[]; if(S.tabR==='layer'||S.tabR==='canvas') renderProps(true); },()=>{});
  renderProps(true); renderLib();
}

/* ---------- boot ---------- */
function loadBrandFonts(){
  for(const f of BRAND_FONTS){
    const face=new FontFace(f.family,`url(/scoop/fonts/${f.file})`,{weight:'normal',style:'normal'});
    face.load().then(loaded=>{ document.fonts.add(loaded); scheduleRender(); }).catch(()=>{ toast('Missing font file: '+f.file,true); });
  }
}
function boot(){
  loadBrandFonts();
  let doc=null;
  try{ const s=localStorage.getItem('scoop-builder:draft'); if(s) doc=JSON.parse(s); }catch(e){}
  if(!doc||(!Array.isArray(doc.layers)&&!(Array.isArray(doc.pages)&&doc.pages.length))) doc=starterDoc();
  loadDoc(doc);
  const samples=KINDS.map(k=>makeDoc(k.id));
  document.fonts.ready
    .then(()=>Promise.all(samples.flatMap(st=>st.layers.filter(l=>l.type==='text').map(L=>document.fonts.load(fontStr(L),'Aa').catch(()=>{})))))
    .then(()=>Promise.all(samples.map(st=>allImagesReady(st))))
    .then(()=>{ samples.forEach((st,i)=>{ kindThumbs[KINDS[i].id]=thumbData(st,300); }); renderLib(); });
  renderLib();
  initBackend();
}
boot();
})();
