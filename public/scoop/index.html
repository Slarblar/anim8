<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SLC Scoop Post Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400..900;1,400..900&family=Archivo+Black&family=Barlow+Condensed:ital,wght@0,400;0,600;0,800;1,400;1,600;1,800&family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;600;800&family=Oswald:wght@400;600;700&family=Permanent+Marker&family=Roboto+Condensed:ital,wght@0,300..900;1,300..900&display=swap">
<style>
body{margin:0}
img{max-width:100%}
/* Layout: three-column editor — shared library left, artboard center, quick-fill / layer controls right.
   Single dark theme on purpose: a neutral dark surround keeps color judgment honest while composing posts. */
:root{
  --bg:#0e0e0f; --panel:#161617; --panel2:#1d1d1f; --raise:#262628; --line:#302f2d;
  --text:#efeee9; --muted:#a09d95; --faint:#6b6964;
  --red:#ED2224; --red-hi:#ff4447; --paper:#F4F5F0; --ok:#5fbf7a;
  --f-ui:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --f-logo:"Anton","Archivo Black",Impact,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:13px;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red-hi);outline-offset:1px}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}

/* top bar */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.mark{display:flex;align-items:baseline;gap:8px;margin-right:6px;white-space:nowrap}
.mark img{height:28px;width:auto;display:block}
.mark small{font-size:10px;font-weight:800;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.docname{background:transparent;border:1px solid transparent;border-radius:4px;padding:5px 8px;width:200px;max-width:40vw;font-weight:600}
.docname:hover,.docname:focus{border-color:var(--line);background:var(--panel2)}
.grp{display:flex;gap:4px;align-items:center}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:4px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;white-space:nowrap;font-weight:600;font-size:12px}
.btn:hover{background:var(--raise);border-color:#46443f}
.btn:disabled{opacity:.4;cursor:default}
.btn.icon{width:30px;padding:0;justify-content:center}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-hi)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--raise)}
.btn svg{width:15px;height:15px;flex:none}
.btn.on{background:var(--red);border-color:var(--red);color:#fff}
.zoomlbl{font-family:var(--f-mono);font-size:11px;min-width:48px;justify-content:center}
select.btn{padding-right:6px}

.ws{display:grid;grid-template-columns:272px minmax(0,1fr) 320px;min-height:0}
.panel{background:var(--panel);min-height:0;display:flex;flex-direction:column}
.left{border-right:1px solid var(--line)}
.right{border-left:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;padding:11px 6px 9px;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--red)}
.pbody{overflow:auto;min-height:0;flex:1;padding:12px 14px 20px;display:flex;flex-direction:column;gap:12px}
.note{color:var(--muted);font-size:12px;line-height:1.45}
.note.warn{color:#f0b35a}
.h{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-top:4px}
details.ps{margin-top:10px}
details.ps>summary{cursor:pointer;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
details.ps[open]>summary{margin-bottom:8px}

/* library */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{position:relative;display:flex;flex-direction:column;gap:5px;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.tcard .th{background:var(--panel2);border:1px solid var(--line);border-radius:4px;overflow:hidden;aspect-ratio:3/4;display:grid;place-items:center}
.tcard .th img{width:100%;height:100%;object-fit:contain}
.tcard:hover .th{border-color:var(--red)}
.tcard .nm{font-weight:700;font-size:12px;line-height:1.25;overflow-wrap:anywhere}
.tcard .meta{font-size:10.5px;color:var(--faint);font-family:var(--f-mono)}
.tcard .del{position:absolute;top:5px;right:5px;opacity:0}
.tcard:hover .del,.acard:hover .del,.del:focus-visible{opacity:1}
.del{width:24px;height:24px;border-radius:4px;border:1px solid var(--line);background:rgba(14,14,15,.85);display:grid;place-items:center;cursor:pointer}
.del svg{width:13px;height:13px}
.del.confirm{width:auto;padding:0 8px;background:var(--red);border-color:var(--red);color:#fff;font-size:11px;font-weight:700;opacity:1}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acard{position:relative;display:flex;flex-direction:column;gap:4px;cursor:grab}
.acard .th{aspect-ratio:1;border-radius:4px;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;
  background-color:#2a2a2c;background-image:linear-gradient(45deg,#333 25%,transparent 25%,transparent 75%,#333 75%),linear-gradient(45deg,#333 25%,transparent 25%,transparent 75%,#333 75%);background-size:12px 12px;background-position:0 0,6px 6px}
.acard .th img{max-width:100%;max-height:100%;object-fit:contain}
.acard:hover .th{border-color:var(--red)}
.acard .nm{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .del{position:absolute;top:3px;right:3px;opacity:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:11px;font-weight:600;background:none;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--paper);color:#151616;border-color:var(--paper)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row > *{min-width:0}
.inp,.sel,textarea.inp{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%;min-width:0}
.inp:focus,.sel:focus{border-color:#55524c;outline:none}
textarea.inp{resize:vertical;min-height:58px;line-height:1.4}
.fontrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel2)}
.fontrow .pv{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fontrow .tag{font-size:10px;color:var(--faint);font-family:var(--f-mono);flex:none}

/* stage */
.stagewrap{position:relative;min-height:0;min-width:0;background:#0b0b0c}
.stage{position:absolute;inset:0 0 78px 0;overflow:hidden;touch-action:none;background-color:#0b0b0c;background-image:radial-gradient(#232325 1px,transparent 1px);background-size:22px 22px;cursor:default}
.world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
.art{position:absolute;background:#111}
.artc{width:100%;height:100%;display:block}
.artname{position:absolute;left:0;bottom:100%;color:#8d8b86;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.art.on .artname{color:#f4f5f0}
#ov{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
.stagehint{position:absolute;left:12px;bottom:88px;font-size:11px;color:var(--faint);pointer-events:none;font-family:var(--f-mono)}
.pages{position:absolute;left:0;right:0;bottom:0;height:78px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#121214;border-top:1px solid var(--line);overflow-x:auto;z-index:4}
.pg{flex:none;width:54px;display:flex;flex-direction:column;gap:2px;align-items:center;border:1px solid var(--line);background:#1c1c1e;border-radius:4px;padding:4px 4px 3px;cursor:pointer;color:var(--faint);font-size:9px;font-family:var(--f-mono)}
.pg canvas{width:44px;height:44px;background:#111;display:block;object-fit:contain}
.pg.on{border-color:var(--red);color:var(--text)}
.pgadd{flex:none;height:52px;padding:0 10px;border-radius:4px;border:1px solid var(--line);background:#1c1c1e;color:var(--text);font-size:11px;font-weight:700;cursor:pointer}
.pgadd:hover,.pg:hover{border-color:var(--red)}
.cropbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;border-radius:4px;padding:6px 10px;font-weight:700;font-size:12px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:5}
.cropbar button{background:#fff;color:#151616;border:0;border-radius:3px;padding:3px 8px;font-weight:700;cursor:pointer;font-size:11px}
.cropbar .bsz{display:flex;align-items:center;gap:6px}
.cropbar input[type=range]{width:120px;accent-color:#fff}
.menu{position:relative}
.menu .pop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px;min-width:148px;box-shadow:0 16px 40px rgba(0,0,0,.45);display:flex;flex-direction:column}
.menu .pop[hidden]{display:none !important}
.menu .pop button{background:none;border:0;color:var(--text);text-align:left;padding:7px 10px;border-radius:4px;cursor:pointer;font-weight:650;font-size:13px}
.menu .pop button:hover{background:var(--panel2)}
.dropmask{position:absolute;inset:10px;border:2px dashed var(--red);border-radius:6px;background:rgba(237,34,36,.06);display:grid;place-items:center;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--paper);pointer-events:none}

/* right panel fields */
.fld{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px;align-items:center}
.fld > label,.lbl{font-size:11px;color:var(--muted);font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mini{display:flex;flex-direction:column;gap:3px;min-width:0}
.mini span{font-size:10px;color:var(--faint);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.num{font-family:var(--f-mono);font-size:12px}
.rng{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:center}
.rng input[type=range]{width:100%;accent-color:var(--red)}
.rng output{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:right}
.colr{display:grid;grid-template-columns:30px minmax(0,1fr);gap:6px}
.colr input[type=color]{width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer}
.sw{display:flex;gap:4px;flex-wrap:wrap;grid-column:2}
.sw button{width:18px;height:18px;border-radius:3px;border:1px solid rgba(255,255,255,.18);cursor:pointer;padding:0}
.sw .add{background:none;border-style:dashed;color:var(--muted);font-size:12px;line-height:1;display:grid;place-items:center}
.chk{display:flex;gap:8px;align-items:center;font-size:12px;cursor:pointer}
.chk input{accent-color:var(--red);width:15px;height:15px}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;background:var(--panel2);border:0;border-right:1px solid var(--line);height:28px;cursor:pointer;display:grid;place-items:center;font-size:11px;font-weight:700}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--paper);color:#151616}
.seg svg{width:14px;height:14px}
.section{display:flex;flex-direction:column;gap:9px;padding-top:12px;border-top:1px solid var(--line)}
.section:first-child{border-top:0;padding-top:0}
.slotcard{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:5px;background:var(--panel2)}
.slotcard.sel{border-color:var(--red)}
.slotcard .lab{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.slotcard .lab em{font-style:normal;color:var(--faint);font-weight:600;letter-spacing:0;text-transform:none;font-family:var(--f-mono);font-size:10px}
.imgslot{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center}
.excerpt{border-color:#4a3a39;background:linear-gradient(180deg,rgba(237,34,36,.08),transparent 70%),var(--panel2)}
.excerpt textarea{min-height:96px}
.imgslot canvas{width:64px;height:64px;border-radius:4px;background:#2a2a2c;border:1px solid var(--line)}
.imgslot .row{gap:5px}

/* layers */
.layers{flex:none;max-height:42%;display:flex;flex-direction:column;border-top:1px solid var(--line);min-height:0}
.layers .lh{display:flex;align-items:center;gap:8px;padding:9px 14px 6px}
.layers .lh .kbd{margin-left:auto}
.llist{overflow:auto;padding:0 8px 10px;display:flex;flex-direction:column;gap:2px;min-height:0}
.lrow{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto auto auto;gap:6px;align-items:center;padding:5px 6px;border-radius:4px;cursor:pointer;border:1px solid transparent}
.lrow:hover{background:var(--panel2)}
.lrow.sel{background:var(--raise);border-color:#4a4843}
.lrow.dim{opacity:.45}
.lrow.over{box-shadow:inset 0 2px 0 var(--red)}
.lrow .ic{width:20px;height:20px;display:grid;place-items:center;color:var(--muted)}
.lrow .ic svg{width:14px;height:14px}
.lrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.lrow .slotb{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--red-hi);border:1px solid rgba(237,34,36,.5);border-radius:3px;padding:1px 4px}
.lrow .tb{width:22px;height:22px;display:grid;place-items:center;border:0;background:none;border-radius:3px;cursor:pointer;color:var(--faint)}
.lrow .tb:hover{color:var(--text);background:var(--line)}
.lrow .tb.act{color:var(--text)}
.lrow .tb:disabled{opacity:1;cursor:default;color:var(--text)}
.lrow .tb svg{width:13px;height:13px}
.lrow input{background:var(--bg);border:1px solid var(--red);border-radius:3px;padding:1px 4px;width:100%;font-size:12px}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(480px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal.wide{width:min(640px,100%)}
.modal h2{margin:0;font-size:18px;font-weight:900;letter-spacing:-.01em}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.modal .previews{display:grid;grid-template-columns:1.15fr .85fr;gap:8px;align-items:stretch}
.modal .preview{background:#0b0b0c;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;min-width:0}
.modal .preview .cap{font-size:11px;font-weight:700;color:var(--muted);align-self:flex-start}
.modal .preview img{max-height:34vh;width:auto;max-width:100%}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.sizes button{display:flex;flex-direction:column;gap:6px;align-items:center;padding:12px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;cursor:pointer}
.sizes button:hover{border-color:var(--red)}
.sizes i{display:block;border:2px solid var(--muted);border-radius:2px}
.sizes b{font-size:12px}
.sizes small{font-family:var(--f-mono);font-size:10px;color:var(--faint)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:#151616;font-weight:700;padding:9px 14px;border-radius:5px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px)}
.toast.err{background:var(--red);color:#fff}
.kbd{font-family:var(--f-mono);font-size:10.5px;color:var(--faint)}
.empty{border:1px dashed var(--line);border-radius:5px;padding:14px;color:var(--muted);font-size:12px;line-height:1.5}

@media (max-width:1100px){ .ws{grid-template-columns:236px minmax(0,1fr) 290px} }
@media (max-width:900px){
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  .ws{grid-template-columns:minmax(0,1fr);grid-auto-rows:auto}
  .stagewrap{order:-1;height:64vh}
  .left,.right{border:0;border-top:1px solid var(--line)}
  .pbody{max-height:none}
  .layers{max-height:none}
  .docname{width:140px}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="mark"><img src="/scoop/slcscoop-logo.png" alt="SLC Scoop" width="300" height="67"><small>Post Builder</small></div>
    <input id="docname" class="docname" aria-label="Post name" value="Untitled post">
    <div class="grp">
      <button class="btn" data-act="add-text" title="Add text (T)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3.5h10M8 3.5v10"/></svg>Text</button>
      <button class="btn" data-act="add-image" title="Add image"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1"/><circle cx="6" cy="6.5" r="1.2"/><path d="M2.5 12l3.5-3.5 2.5 2.5 2-2 3 3"/></svg>Image</button>
      <div class="menu" id="redactMenu">
        <button type="button" class="btn" id="redactBtn" aria-haspopup="true" aria-expanded="false" title="Redact (R)">Redact</button>
        <div class="pop" id="redactPop" hidden>
          <button type="button" data-redact="rect">Box</button>
          <button type="button" data-redact="ellipse">Ellipse</button>
          <button type="button" data-redact="brush">Brush</button>
        </div>
      </div>
      <select id="addshape" class="btn sel" aria-label="Add shape" style="width:auto">
        <option value="">+ Shape</option>
        <option value="rect">Rectangle</option>
        <option value="ellipse">Ellipse</option>
        <option value="torn">Torn paper strip</option>
        <option value="fade">Photo fade (gradient)</option>
        <option value="pin">Location pin</option>
        <option value="arrow">Arrow</option>
      </select>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <button class="btn icon ghost" data-act="undo" id="bUndo" aria-label="Undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 4L2 7l3 3"/><path d="M2.5 7H10a4 4 0 010 8H7"/></svg></button>
      <button class="btn icon ghost" data-act="redo" id="bRedo" aria-label="Redo" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 4l3 3-3 3"/><path d="M13.5 7H6a4 4 0 000 8h3"/></svg></button>
    </div>
    <div class="grp">
      <button class="btn icon ghost" data-act="zoom-out" aria-label="Zoom out">−</button>
      <button class="btn ghost zoomlbl" data-act="zoom-fit" id="zoomlbl" title="Fit to screen">Fit</button>
      <button class="btn icon ghost" data-act="zoom-in" aria-label="Zoom in">+</button>
    </div>
    <span class="spacer"></span>
    <div class="grp">
      <button class="btn" data-act="new">New</button>
      <button class="btn" data-act="save-tpl">Save template</button>
      <button class="btn primary" data-act="export"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 2v8M4.5 6.5L8 10l3.5-3.5M3 13.5h10"/></svg>Export</button>
    </div>
  </header>

  <div class="ws">
    <aside class="panel left" aria-label="Library">
      <div class="tabs" role="tablist">
        <button role="tab" data-ltab="templates" aria-selected="true">Templates</button>
        <button role="tab" data-ltab="assets" aria-selected="false">Assets</button>

/* ---------- geometry ---------- */
function rotP(L,lx,ly){ const a=(L.rot||0)*Math.PI/180,c=Math.cos(a),s=Math.sin(a),cx=L.x+L.w/2,cy=L.y+L.h/2; return [cx+lx*c-ly*s, cy+lx*s+ly*c]; }

function view(){
  const r=ov.getBoundingClientRect();
  if(!main||!S.doc) return {r,c:r,k:S.cam.k||1,ox:0,oy:0};
  const c=main.getBoundingClientRect(); const k=(c.width||1)/(S.doc.w||1);

function handlesFor(L,v){

/* ---------- overlay ---------- */
function drawOverlay(){
  const dpr=window.devicePixelRatio||1, r=ov.getBoundingClientRect();

  if(ov.width!==W||ov.height!==H){ ov.width=W; ov.height=H; }
  const c=ov.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,r.width,r.height);
  const v=view(); const T=(x,y)=>[v.ox+x*v.k, v.oy+y*v.k];
  const poly=(L)=>{ c.beginPath(); [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([a,b],i)=>{const [x,y]=rotP(L,a*L.w/2,b*L.h/2);const [sx,sy]=T(x,y); i?c.lineTo(sx,sy):c.moveTo(sx,sy);}); c.closePath(); };

  c.strokeStyle='#ff3df0'; c.lineWidth=1; c.setLineDash([]);
  for(const g of S.guides){ c.beginPath(); if(g.x!=null){const [sx]=T(g.x,0); c.moveTo(sx+.5,v.oy); c.lineTo(sx+.5,v.oy+S.doc.h*v.k);} else {const [,sy]=T(0,g.y); c.moveTo(v.ox,sy+.5); c.lineTo(v.ox+S.doc.w*v.k,sy+.5);} c.stroke(); }
  const H2=S.doc.layers.find(l=>l.id===S.hover);
  if(H2 && H2.id!==S.sel && H2.type!=='folder' && layerShown(H2)){ poly(H2); c.strokeStyle='rgba(237,34,36,.6)'; c.lineWidth=1; c.stroke(); }
  const brushCursor=()=>{
    if(!S.brush||!S.brushAt) return;
    const sx=v.ox+S.brushAt.x*v.k, sy=v.oy+S.brushAt.y*v.k, rad=Math.max(3,(S.brushSize/2)*v.k);
    c.beginPath(); c.arc(sx,sy,rad,0,Math.PI*2);
    c.strokeStyle='rgba(0,0,0,.8)'; c.lineWidth=3; c.stroke();
    c.strokeStyle='#fff'; c.lineWidth=1.5; c.stroke();
  };
  const L=sel(); if(!L||L.type==='folder'||!layerShown(L)){ brushCursor(); return; }
  if(S.crop && L.type==='image' && L.src){
    const img=getImg(L.src);
    if(img){ const d=coverDims(L,img); c.save(); c.setLineDash([5,4]); c.strokeStyle='rgba(255,255,255,.7)';
      c.beginPath(); [[d.dx,d.dy],[d.dx+d.dw,d.dy],[d.dx+d.dw,d.dy+d.dh],[d.dx,d.dy+d.dh]].forEach(([lx,ly],i)=>{const [x,y]=rotP(L,lx-L.w/2,ly-L.h/2);const [sx,sy]=T(x,y);i?c.lineTo(sx,sy):c.moveTo(sx,sy);}); c.closePath(); c.stroke(); c.restore(); }

  const hs=handlesFor(L,v); const top=hs.find(h=>h.hx===0&&h.hy===-1)||(()=>{const [x,y]=rotP(L,0,-L.h/2);const [sx,sy]=T(x,y);return{sx,sy};})();

  c.beginPath(); c.moveTo(top.sx,top.sy); c.lineTo(rh.sx,rh.sy); c.strokeStyle='#ED2224'; c.lineWidth=1; c.stroke();

    if(h.rot) c.arc(h.sx,h.sy,5.5,0,Math.PI*2); else c.rect(h.sx-4.5,h.sy-4.5,9,9);
    c.fillStyle='#fff'; c.fill(); c.strokeStyle='#ED2224'; c.lineWidth=1.5; c.stroke();
  }

}

/* ---------- history ---------- */
function snap(){ return JSON.stringify(S.doc); }
function commit(){ const s=snap(); if(s===S.hist[S.hi]) return; S.hist=S.hist.slice(0,S.hi+1); S.hist.push(s); if(S.hist.length>80) S.hist.shift(); S.hi=S.hist.length-1; S.dirty=true; saveDraft(); updUndo(); touchPages(); }

function undo(){ if(S.hi<=0) return; S.hi--; restore(S.hist[S.hi]); }
function redo(){ if(S.hi>=S.hist.length-1) return; S.hi++; restore(S.hist[S.hi]); }
function restore(s){ const keep=S.sel; S.doc=activate(JSON.parse(s)); if(!sel()) S.sel=null; else S.sel=keep; S.crop=false; $('#cropbar').hidden=true; if(S.brush && (!sel()||sel().type!=='redact')){ S.brush=false; S.brushAt=null; } afterLoad(false); syncRedactTool(); saveDraft(); updUndo(); }
function updUndo(){ $('#bUndo').disabled=S.hi<=0; $('#bRedo').disabled=S.hi>=S.hist.length-1; }
let draftT=0;
function saveDraft(){ clearTimeout(draftT); draftT=setTimeout(()=>{ try{ localStorage.setItem('scoop-builder:draft',snap()); }catch(e){} },300); }

/* ---------- doc load ---------- */
function loadDoc(doc,{fresh=true}={}){

/* ---------- camera / artboards ---------- */

}
function worldBounds(){ let w=1,h=1; for(const b of S.layout){ w=Math.max(w,b.x+b.w); h=Math.max(h,b.y+b.h); } return {w,h}; }
function artCanvas(i){ return $('#world')?.querySelector('.art[data-pi="'+i+'"] canvas')||null; }
function syncArtboards(){

  const k=Math.max(.05,S.cam.k);

    el.classList.toggle('on', i===S.doc.page);

function applyCam(){
  const world=$('#world'); if(!world) return;
  world.style.transform=`translate(${S.cam.x}px,${S.cam.y}px) scale(${S.cam.k})`;
  stage.style.backgroundPosition=`${S.cam.x}px ${S.cam.y}px`;
  S.k=S.cam.k;
  const lbl=$('#zoomlbl'); if(lbl) lbl.textContent=(S.zoom==='fit'?'Fit · ':'')+Math.round(S.cam.k*100)+'%';

function worldPoint(e){

/* ---------- view / zoom ---------- */
function fitView(){

new ResizeObserver(()=>{ if(!S.doc) return; if(S.zoom==='fit') fitView(); else { markArts(); applyCam(); scheduleRender(); } }).observe(stage);
window.addEventListener('resize',()=>drawOverlay());

/* ---------- adding layers ---------- */
function addLayer(L,{select=true}={}){ S.doc.layers.push(L); if(select) S.sel=L.id; commit(); scheduleRender(); renderLayers(); renderProps(true); return L; }
function centerIn(L,cx,cy){ L.x=Math.round((cx??S.doc.w/2)-L.w/2); L.y=Math.round((cy??S.doc.h/2)-L.h/2); return L; }
function addText(){
  const L=T({text:'New text',size:Math.round(S.doc.w*.06),w:Math.round(S.doc.w*.7),color:'#FFFFFF'});
  L.h=L.size*1.1; centerIn(L); addLayer(L); ensureFonts([L]); setTab('layer');
  setTimeout(()=>{const t=$('#props textarea[data-p="text"]'); if(t){t.focus(); t.select();}},30);
}
function addShape(kind){
  const W=S.doc.w,H=S.doc.h; let L;
  if(kind==='torn') L=SH({shape:'torn',fill:'#F4F5F0',w:W+60,h:Math.round(H*.25),rough:20,seed:1+Math.floor(Math.random()*999)});
  else if(kind==='fade') L=SH({shape:'rect',grad:true,fill:'#000000',fill2:'#000000',fill2Alpha:0,gradAngle:270,w:W,h:Math.round(H*.35),opacity:.7,name:'Photo fade'});
  else if(kind==='pin') L=SH({shape:'pin',fill:'#ED2224',w:48,h:66});

async function blobDims(blob){ const u=URL.createObjectURL(blob); try{ return await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res({w:i.naturalWidth||i.width||400,h:i.naturalHeight||i.height||400});i.onerror=rej;i.src=u;}); } finally{ setTimeout(()=>URL.revokeObjectURL(u),2000);} }
async function localSrc(file){ const key='loc_'+uid(); localBlobs.set(key,file); idbPut(key,file); return {kind:'local',key}; }
function slotAt(x,y){ for(let i=S.doc.layers.length-1;i>=0;i--){ const L=S.doc.layers[i]; if(L.type==='image'&&L.slot&&L.visible&&inside(L,x,y)) return L; } return null; }
function fillSlot(L,src,dims){ L.src=src; L.nw=dims.w; L.nh=dims.h; L.fit='cover'; L.fx=.5; L.fy=.5; L.zoom=1; S.sel=L.id; commit(); loadEntry(src); scheduleRender(); renderLayers(); renderProps(true); }
function placeImage(src,dims,name,at){
  const W=S.doc.w,H=S.doc.h;
  const near=(a,b)=>Math.abs(a-b)/Math.max(b,1)<0.035;
  let w=dims.w, h=dims.h;
  if(near(dims.w,W)&&near(dims.h,H)){ w=W; h=H; }
  else if(near(dims.w/Math.max(1,dims.h), W/H) && dims.w>=W*0.9 && dims.h>=H*0.9){ w=W; h=H; }
  else { const s=Math.min(1,W/dims.w,H/dims.h); w=Math.round(dims.w*s); h=Math.round(dims.h*s); }
  let x,y;
  if(w===W && h===H){ x=0; y=0; }
  else {
    x=Math.round((at?.x??W/2)-w/2); y=Math.round((at?.y??H/2)-h/2);
    if(near(w,W)){ x=0; w=W; }
    if(near(h,H)){ y=0; h=H; }
    const thr=20;
    const sx=closestTarget(x, edgeTargets('x'), thr, 0) ?? (closestTarget(x+w, edgeTargets('x'), thr, 0)!=null ? closestTarget(x+w, edgeTargets('x'), thr, 0)-w : null);
    const sy=closestTarget(y, edgeTargets('y'), thr, 0) ?? (closestTarget(y+h, edgeTargets('y'), thr, 0)!=null ? closestTarget(y+h, edgeTargets('y'), thr, 0)-h : null);
    if(sx!=null) x=sx;
    if(sy!=null) y=sy;
  }
  const L=IM({src,nw:dims.w,nh:dims.h,w:Math.round(w),h:Math.round(h),x:Math.round(x),y:Math.round(y),fit:'stretch',name:name||'Image'});
  loadEntry(src); addLayer(L);
}
function isPsdFile(f){ return !!f && (/\.psd$/i.test(f.name||'') || f.type==='image/vnd.adobe.photoshop' || f.type==='application/x-photoshop' || f.type==='image/x-photoshop'); }
async function handleFiles(files,at){
  const list=[...files];
  const psd=list.find(isPsdFile);
  if(psd){ importPsdFile(psd); return; }
  const imgs=list.filter(f=>/^image\/(png|webp|jpeg|svg\+xml)$/.test(f.type));
  if(!imgs.length){ toast('Use PNG, WebP, JPG, SVG or a Photoshop PSD.',true); return; }
  for(const f of imgs){
    const dims=await blobDims(f).catch(()=>({w:800,h:800})); const src=await localSrc(f);
    const target = at? slotAt(at.x,at.y) : null;
    if(target) fillSlot(target,src,dims); else placeImage(src,dims,f.name.replace(/\.[^.]+$/,''),at);
  }
}

// public/scoop/vendor/ag-psd.js is the browser build of the ag-psd dependency.
function loadAgPsd(){
  if(window.agPsd&&window.agPsd.readPsd) return Promise.resolve(window.agPsd);
  if(!agPsdP) agPsdP=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='/scoop/vendor/ag-psd.js';
    s.onload=()=>window.agPsd&&window.agPsd.readPsd?res(window.agPsd):rej(new Error('ag-psd'));
    s.onerror=()=>rej(new Error('ag-psd'));
    document.head.appendChild(s);
  });
  return agPsdP;
}
function canvasBlob(canvas,type,q){
  return new Promise(res=>{ try{ canvas.toBlob(b=>res(b),type,q); }catch(e){ res(null); } });
}
async function pixelsFromCanvas(canvas,name){
  let blob=await canvasBlob(canvas,'image/webp',0.92);
  if(!blob||blob.type!=='image/webp') blob=await canvasBlob(canvas,'image/png');
  if(!blob) throw new Error('blob');
  const ext=blob.type==='image/webp'?'.webp':'.png';
  const file=new File([blob],(slug(name)||'layer')+'-'+uid()+ext,{type:blob.type||'image/png'});
  return {src:await localSrc(file), nw:canvas.width||1, nh:canvas.height||1};
}
function parsePsdName(raw){
  let name=String(raw||'').trim()||'Layer';
  let isSlot=false, locked=false, web=null;
  for(let i=0;i<8;i++){
    const m=/^(slot|lock|web|noweb)\s*:\s*/i.exec(name);
    if(!m) break;
    const key=m[1].toLowerCase();
    name=name.slice(m[0].length).trim();
    if(key==='slot') isSlot=true;
    else if(key==='lock') locked=true;
    else if(key==='web') web=true;
    else if(key==='noweb') web=false;
  }
  const empty=/\bempty\b/i.test(String(raw||''));
  const label=name.replace(/\bempty\b/ig,' ').replace(/\s{2,}/g,' ').trim()||'Layer';
  return {name:label, slot:isSlot?label:'', locked, web, empty};
}
function mapPsdBlend(mode,name,report){
  const m=mode||'normal';
  if(PSD_BLEND[m]) return PSD_BLEND[m];
  if(m!=='pass through') report.notes.push('Blend mode “'+m+'” on '+name);
  return 'source-over';
}
function mapPsdFont(psName,report){
  const raw=String(psName||'').trim();
  const key=raw.toLowerCase().replace(/\s+/g,'');
  const known=PSD_FONT[key];
  if(!report.fonts.some(f=>f.from===(raw||'Unknown'))) report.fonts.push({from:raw||'Unknown', to:known||null});
  return known||raw||'Archivo';
}
function psdColor(c){
  if(!c) return '#000000';
  let r,g,b;
  if('r' in c){ r=c.r; g=c.g; b=c.b; }
  else if('fr' in c){ r=c.fr*255; g=c.fg*255; b=c.fb*255; }
  else if('k' in c && !('c' in c)){ r=g=b=c.k; }
  else return '#000000';
  if(r<=1 && g<=1 && b<=1){ r*=255; g*=255; b*=255; }
  const h=v=>Math.round(Math.min(255,Math.max(0,v))).toString(16).padStart(2,'0');
  return '#'+h(r)+h(g)+h(b);
}
function psdEffects(effects){
  if(!effects||effects.disabled) return [];
  const keys=[['dropShadow','Drop shadow'],['innerShadow','Inner shadow'],['outerGlow','Outer glow'],['innerGlow','Inner glow'],['bevel','Bevel'],['solidFill','Color overlay'],['satin','Satin'],['stroke','Stroke'],['gradientOverlay','Gradient overlay'],['patternOverlay','Pattern overlay']];
  const out=[];
  for(const [key,label] of keys){
    const v=effects[key];
    const items=Array.isArray(v)?v:(v?[v]:[]);
    if(items.some(e=>e&&e.enabled)) out.push(label);
  }
  return out;
}
function psdHasMask(layer){
  const m=layer.mask;
  if(m&&!m.disabled){
    const w=Math.abs((m.right||0)-(m.left||0)), h=Math.abs((m.bottom||0)-(m.top||0));
    if(w>1&&h>1) return true;
  }
  const v=layer.vectorMask;
  return !!(v&&!v.disable&&Array.isArray(v.paths)&&v.paths.length);
}
function notePsdExtras(layer,name,report){
  for(const label of psdEffects(layer.effects)) report.notes.push(label+' on '+name);
  if(psdHasMask(layer)) report.notes.push('Mask on '+name);
  if(layer.clipping) report.notes.push('Clipping mask on '+name);
  if(layer.text&&layer.text.orientation==='vertical') report.notes.push(name+' is vertical text');
  if(layer.text&&layer.text.warp&&layer.text.warp.style&&layer.text.warp.style!=='none') report.notes.push('Text warp on '+name);
}
function psdStyle(text){
  const style=Object.assign({}, text.style||{});
  const runs=text.styleRuns||[];
  if(runs[0]&&runs[0].style){ for(const k of Object.keys(runs[0].style)) if(style[k]==null) style[k]=runs[0].style[k]; }
  const mixed=runs.length>1 && runs.some(r=>r.style&&(r.style.font||r.style.fontSize));
  return {style, mixed};
}
function psdAlign(text){
  const j=(text.paragraphStyle&&text.paragraphStyle.justification)||(text.paragraphStyleRuns&&text.paragraphStyleRuns[0]&&text.paragraphStyleRuns[0].style&&text.paragraphStyleRuns[0].style.justification)||'left';
  if(j==='center'||j==='justify-center') return 'center';
  if(j==='right'||j==='justify-right') return 'right';
  return 'left';
}
function psdTextFrame(text,layer){
  const m=(text.transform&&text.transform.length>=6)?text.transform:[1,0,0,1,layer.left||0,layer.top||0];
  const [xx,xy,yx,yy,tx,ty]=m;
  const map=(x,y)=>({x:xx*x+yx*y+tx, y:xy*x+yy*y+ty});
  if(Array.isArray(text.boxBounds)&&text.boxBounds.length>=4){
    const [l,t,r,b]=text.boxBounds;
    const p00=map(l,t), p10=map(r,t), p01=map(l,b), p11=map(r,b);
    const w=Math.hypot(p10.x-p00.x, p10.y-p00.y);
    const h=Math.hypot(p01.x-p00.x, p01.y-p00.y);
    const rot=Math.atan2(p10.y-p00.y, p10.x-p00.x)*180/Math.PI;
    const cx=(p00.x+p11.x)/2, cy=(p00.y+p11.y)/2;
    return {x:cx-w/2, y:cy-h/2, w, h, rot, sy:Math.hypot(yx,yy)||1};
  }
  const x=text.left||layer.left||0, y=text.top||layer.top||0;
  const right=text.right||layer.right||x+200, bottom=text.bottom||layer.bottom||y+40;
  return {x, y, w:Math.max(8,right-x), h:Math.max(8,bottom-y), rot:0, sy:Math.hypot(yx,yy)||1};
}
function psdBox(layer){
  const x=layer.left||0, y=layer.top||0;
  return {x, y, w:(layer.right??x)-x, h:(layer.bottom??y)-y};
}
function round2(n){ return Math.round(n*100)/100; }
async function importPsdLeaf(layer, opacity, hidden, report, out, page){
  const meta=parsePsdName(layer.name);
  notePsdExtras(layer, meta.name, report);
  if(layer.adjustment){
    const t=(layer.adjustment.type||'adjustment');
    report.notes.push(t.charAt(0).toUpperCase()+t.slice(1)+' on '+meta.name);
    return;
  }
  if(layer.text&&typeof layer.text.text==='string'){
    const {style,mixed}=psdStyle(layer.text);
    if(mixed) report.notes.push(meta.name+' uses more than one text style. The first style was kept.');
    const frame=psdTextFrame(layer.text, layer);
    const size=Math.max(1, (style.fontSize||12)*(frame.sy||1));
    const auto=style.autoLeading!==false;
    const lh=(!auto && style.leading>0 && style.fontSize>0)?style.leading/style.fontSize:1.2;
    let hs=style.horizontalScale;
    if(hs==null||!isFinite(hs)||hs===0) hs=1;
    hs=Math.abs(hs)>3?hs/100:hs;
    const L=T({
      name:meta.name, text:String(layer.text.text).replace(/\r/g,'\n'),
      font:mapPsdFont(style.font&&style.font.name, report),
      weight:400, italic:false,
      size:round2(size), lh:round2(Math.min(3,Math.max(0.6,lh))),
      ls:round2(((+style.tracking||0)*size)/1000),
      hscale:round2(Math.min(4,Math.max(0.2,hs))),
      upper:style.fontCaps===2, color:psdColor(style.fillColor), align:psdAlign(layer.text),
      x:round2(frame.x), y:round2(frame.y), w:Math.max(8,round2(frame.w)), h:Math.max(8,round2(frame.h)),
      opacity:Math.min(1,Math.max(0,opacity)), blend:mapPsdBlend(layer.blendMode, meta.name, report),
      visible:!hidden, locked:meta.locked, slot:meta.slot,
    });
    if(Math.abs(frame.rot)>0.05) L.rot=round2(frame.rot);
    if(meta.web!==null) L.web=meta.web;
    out.push(L);
    if(layer.canvas&&layer.canvas.width&&layer.canvas.height){
      const box=psdBox(layer);
      const px=await pixelsFromCanvas(layer.canvas, meta.name+'-reference');
      const ref=IM({
        name:meta.name+' (PSD reference)', src:px.src, nw:px.nw, nh:px.nh,
        x:box.w?box.x:L.x, y:box.h?box.y:L.y, w:box.w||px.nw, h:box.h||px.nh,
        fit:'stretch', visible:false, web:false, opacity:1,
      });
      ref.psdRef=true;
      out.push(ref);
    }
    return;
  }
  const box=psdBox(layer);
  const emptySlot=meta.empty&&meta.slot;
  if(layer.canvas&&layer.canvas.width&&layer.canvas.height&&!emptySlot){
    const px=await pixelsFromCanvas(layer.canvas, meta.name);
    const L=IM({
      name:meta.name, src:px.src, nw:px.nw, nh:px.nh, fit:'stretch',
      x:round2(box.x), y:round2(box.y), w:Math.max(1,round2(box.w||px.nw)), h:Math.max(1,round2(box.h||px.nh)),
      opacity:Math.min(1,Math.max(0,opacity)), blend:mapPsdBlend(layer.blendMode, meta.name, report),
      visible:!hidden, locked:meta.locked, slot:meta.slot,
    });
    if(meta.web!==null) L.web=meta.web;
    out.push(L);
    return;
  }
  if(emptySlot){
    const framed=box.w>1&&box.h>1;
    const L=IM({
      name:meta.name, src:null, fit:'stretch',
      x:framed?round2(box.x):0, y:framed?round2(box.y):0,
      w:framed?Math.max(1,round2(box.w)):page.w, h:framed?Math.max(1,round2(box.h)):page.h,
      opacity:Math.min(1,Math.max(0,opacity)), blend:mapPsdBlend(layer.blendMode, meta.name, report),
      visible:!hidden, locked:meta.locked, slot:meta.slot,
    });
    if(meta.web!==null) L.web=meta.web;
    out.push(L);
    return;
  }
  if(layer.placedLayer) report.notes.push('Smart object '+meta.name+' has no pixels');
  else if(layer.vectorFill||layer.vectorStroke||layer.vectorMask) report.notes.push('Vector shape on '+meta.name);
}
async function flattenPsd(layers, parentOpacity, parentHidden, report, out, page){
  for(const layer of layers||[]){
    const opacity=parentOpacity*(layer.opacity??1)*(layer.fillOpacity??1);
    const hidden=parentHidden||!!layer.hidden;
    if(layer.children){
      const g=parsePsdName(layer.name);
      if(layer.blendMode&&layer.blendMode!=='pass through'&&layer.blendMode!=='normal') report.notes.push('Group blend “'+layer.blendMode+'” on '+g.name+' was not applied');
      notePsdExtras(layer, g.name, report);
      await flattenPsd(layer.children, opacity, hidden, report, out, page);
    } else await importPsdLeaf(layer, opacity, hidden, report, out, page);
  }
}
function openPsdReport(report){
  const slots=report.slots.length?report.slots.map(esc).join(', '):'None. Name a layer slot:Headline in Photoshop to make a quick-fill slot.';
  const fonts=report.fonts.length?report.fonts.map(f=>f.to?esc(f.from)+' → '+esc(f.to):esc(f.from)+' kept its Photoshop name').join('<br>'):'No text layers.';
  const notes=report.notes.length?report.notes.map(esc).join('<br>'):'Nothing was left out.';
  const refs=report.refs;
  const m=openModal(`<h2>Imported “${esc(report.docName)}”</h2>
    <div class="note">${report.w}×${report.h} · ${report.count} layer${report.count===1?'':'s'} · ${report.slots.length} quick-fill slot${report.slots.length===1?'':'s'}</div>
    <div class="note"><b>Slots.</b> ${slots}</div>
    <div class="note"><b>Fonts.</b><br>${fonts}</div>
    <div class="note"><b>Not applied.</b> Layer effects, masks and adjustment layers stay in Photoshop.<br>${notes}</div>
    ${refs?`<div class="note">Each text layer has a hidden image above it named “(PSD reference)”, for checking position against the Photoshop type.</div>
    <div class="acts"><button class="btn" id="psdDropRefs">Remove reference layers</button><button class="btn primary" data-close>Done</button></div>`:`<div class="acts"><button class="btn primary" data-close>Done</button></div>`}`);
  const modal=m.querySelector('.modal'); if(modal) modal.classList.add('wide');
  m.querySelector('[data-close]').onclick=closeModal;
  const drop=$('#psdDropRefs', m);
  if(drop) drop.onclick=()=>{
    let n=0;
    S.doc.pages.forEach(p=>{ const next=p.layers.filter(l=>!l.psdRef); n+=p.layers.length-next.length; p.layers=next; });
    if(S.sel&&!S.doc.layers.some(l=>l.id===S.sel)) S.sel=null;
    drop.disabled=true; drop.textContent=n?`Removed ${n} reference layer${n===1?'':'s'}`:'No reference layers';
    commit(); scheduleRender(); renderLayers(); renderProps(true);
  };
}
async function importPsdFile(file){
  if(psdBusy||!file) return;
  if(!isPsdFile(file)){ toast('Choose a .psd file.',true); return; }
  if(!(await guardDirty())) return;
  psdBusy=true;
  toast('Reading '+file.name+'…');
  await new Promise(r=>setTimeout(r,40));
  try{
    const ag=await loadAgPsd();
    const psd=ag.readPsd(await file.arrayBuffer(),{useImageData:false, skipCompositeImageData:true, skipThumbnail:true, skipLinkedFilesData:true});
    const w=Math.max(1,Math.round(psd.width||0)), h=Math.max(1,Math.round(psd.height||0));
    if(!(psd.width>0)||!(psd.height>0)) throw new Error('size');
    const report={notes:[], fonts:[], slots:[]};
    const layers=[];
    await flattenPsd(psd.children, 1, false, report, layers, {w, h});
    if(!layers.length){ toast('That Photoshop file has no layers to place.',true); return; }
    report.notes=[...new Set(report.notes)];
    report.slots=[...new Set(layers.filter(l=>l.slot).map(l=>l.slot))];
    report.count=layers.filter(l=>!l.psdRef).length;
    report.refs=layers.some(l=>l.psdRef);
    report.w=w; report.h=h;
    report.docName=String(file.name||'').replace(/\.psd$/i,'').trim()||'Untitled post';
    const page={id:uid(),name:'Page 1',w,h,bg:'#151616',layers};
    loadDoc({name:report.docName, templateId:null, templateType:'single', page:0, pages:[page]});
    S.dirty=true;
    setTab('fill');
    openPsdReport(report);
  }catch(err){
    toast('Couldn\'t read that Photoshop file.',true);
  }finally{ psdBusy=false; }
}
function addAsset(a,at){
  const src={kind:'asset',assetId:a.assetId,url:a.url||''}; const dims={w:a.w||600,h:a.h||600};
  const target = at? slotAt(at.x,at.y) : null;
  if(target) fillSlot(target,src,dims); else placeImage(src,dims,a.name,at);
}

/* ---------- artboard edge snap ---------- */
function edgeTargets(axis, skipId){
  const art=axis==='x'?[0,S.doc.w]:[0,S.doc.h];
  const out=art.map(v=>({v,rank:0}));
  for(const L of S.doc.layers){
    if(!L.visible||L.type==='folder'||L.id===skipId||Math.abs(L.rot||0)>0.5) continue;
    const a=axis==='x'?L.x:L.y, b=a+(axis==='x'?L.w:L.h);
    out.push({v:a,rank:1},{v:b,rank:1});
  }
  return out;
}
function closestTarget(pos, targets, thrEdge, thrOther){
  let best=null;
  for(const t of targets){
    const thr=t.rank===0?thrEdge:thrOther;
    const d=Math.abs(pos-t.v);
    if(d<=thr && (!best || d<best.d-0.01 || (Math.abs(d-best.d)<=0.5 && t.rank<best.rank))) best={d,v:t.v,rank:t.rank};
  }
  return best?best.v:null;
}
function pickSnap(points, targets, thrEdge, thrOther){
  let best=null;
  for(const p of points) for(const t of targets){
    const thr=t.rank===0?thrEdge:thrOther;
    const d=Math.abs(p.pos-t.v);
    if(d<=thr && (!best || d<best.d-0.01 || (Math.abs(d-best.d)<=0.5 && t.rank<best.rank))) best={d,value:t.v-p.origin,guide:t.v,rank:t.rank};
  }
  return best;
}
function snapMove(nx,ny,w,h,id,k){
  const edge=14/k, other=8/k;
  S.guides=[];
  let bx=pickSnap([{pos:nx,origin:0},{pos:nx+w,origin:w}], edgeTargets('x',id), edge, other);
  let by=pickSnap([{pos:ny,origin:0},{pos:ny+h,origin:h}], edgeTargets('y',id), edge, other);
  if(!bx) bx=pickSnap([{pos:nx+w/2,origin:w/2}], [{v:S.doc.w/2,rank:0}], other, other);
  if(!by) by=pickSnap([{pos:ny+h/2,origin:h/2}], [{v:S.doc.h/2,rank:0}], other, other);
  if(bx){ nx=bx.value; S.guides.push({x:bx.guide}); }
  if(by){ ny=by.value; S.guides.push({y:by.guide}); }
  return {x:nx,y:ny};
}
function snapResizeEdges(box){
  const {hx,hy,lock,s}=box; let {x,y,w,h}=box;
  const k=box.k||1, edge=14/k, other=8/k, guides=[];
  const tx=edgeTargets('x', s.id), ty=edgeTargets('y', s.id);
  const ratio=s.w/Math.max(1,s.h);
  if(!lock){
    if(hx<0){ const t=closestTarget(x,tx,edge,other); if(t!=null){ const r=x+w; x=t; w=Math.max(8,r-x); guides.push({x:t}); } }
    else if(hx>0){ const t=closestTarget(x+w,tx,edge,other); if(t!=null){ w=Math.max(8,t-x); guides.push({x:t}); } }
    if(hy<0){ const t=closestTarget(y,ty,edge,other); if(t!=null){ const b=y+h; y=t; h=Math.max(8,b-y); guides.push({y:t}); } }
    else if(hy>0){ const t=closestTarget(y+h,ty,edge,other); if(t!=null){ h=Math.max(8,t-y); guides.push({y:t}); } }
    return {x,y,w,h,guides};
  }
  const opts=[];
  const add=(d,n,g)=>{ if(d<=edge && n.w>=8 && n.h>=8) opts.push({d,...n,g}); };
  if(hx) for(const t of tx){
    if(t.rank && Math.abs((hx<0?x:x+w)-t.v)>other) continue;
    const nw=Math.max(0, hx<0 ? x+w-t.v : t.v-x);
    const nh=nw/ratio;
    add(Math.abs((hx<0?x:x+w)-t.v), {x:hx<0?t.v:x, y:hy<0?y+h-nh:y, w:nw, h:nh}, [{x:t.v}]);
  }
  if(hy) for(const t of ty){
    if(t.rank && Math.abs((hy<0?y:y+h)-t.v)>other) continue;
    const nh=Math.max(0, hy<0 ? y+h-t.v : t.v-y);
    const nw=nh*ratio;
    add(Math.abs((hy<0?y:y+h)-t.v), {x:hx<0?x+w-nw:x, y:hy<0?t.v:y, w:nw, h:nh}, [{y:t.v}]);
  }
  opts.sort((a,b)=>a.d-b.d);
  S.guides=guides;
  if(!opts.length) return {x,y,w,h,guides};
  return {x:opts[0].x,y:opts[0].y,w:opts[0].w,h:opts[0].h,guides:opts[0].g};
}

/* ---------- pointer interaction ---------- */
let drag=null, spaceDown=false;
function evDoc(e){ const v=view(); const sx=e.clientX-v.r.left, sy=e.clientY-v.r.top; return {x:(sx-v.ox)/v.k, y:(sy-v.oy)/v.k, sx, sy, v}; }
function layerLocal(L,x,y){ const [lx,ly]=toLocal(L,x,y); return [lx+L.w/2, ly+L.h/2]; }
function distSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
  if(l2<0.01) return Math.hypot(px-ax,py-ay);
  const t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/l2));
  return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
}
function brushHit(L,x,y){
  const [lx,ly]=layerLocal(L,x,y);
  for(const st of L.strokes||[]){
    if(st.erase) continue;
    const rad=(+st.size||28)/2+6, pts=st.points||[];
    for(let i=0;i<pts.length;i++){
      const a=pts[i], b=pts[Math.min(i+1,pts.length-1)];
      if(distSeg(lx,ly,a[0],a[1],b[0],b[1])<=rad) return true;
    }
  }
  return false;
}
function hitTest(x,y){ for(let i=S.doc.layers.length-1;i>=0;i--){ const L=S.doc.layers[i]; if(L.type==='folder'||!layerShown(L)||layerLocked(L)) continue; if(L.type==='redact'&&L.shape==='brush'){ if(brushHit(L,x,y)) return L; continue; } if(inside(L,x,y)) return L; } return null; }
function holdPointer(e){ try{ if(e.pointerId!=null) stage.setPointerCapture(e.pointerId); }catch(err){} }
function startCam(e,clear){
  drag={mode:'cam',x:e.clientX,y:e.clientY,cx:S.cam.x,cy:S.cam.y,moved:false,clear:!!clear};
  holdPointer(e); stage.style.cursor='grabbing'; e.preventDefault();
}
stage.addEventListener('pointerdown',e=>{
  if(e.button===1 || (e.button===0 && spaceDown)){ startCam(e,false); return; }
  if(e.button!==0) return;
  const idx=indexFromEvent(e);
  if(idx<0){ startCam(e,true); return; }
  if(idx!==S.doc.page){
    if(S.brush) exitDrawTools();
    S.sel=null; S.crop=false; $('#cropbar').hidden=true; S.doc.page=idx;
    syncArtboards(); renderLayers(); renderProps(true); renderPages();
  }
  const p=evDoc(e); const L=sel();
  if(S.tool){
    const shape=S.tool==='redact-ellipse'?'ellipse':'rect';

stage.addEventListener('pointermove',e=>{
  if(drag && drag.mode==='cam'){
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(Math.hypot(dx,dy)>3) drag.moved=true;
    S.cam.x=drag.cx+dx; S.cam.y=drag.cy+dy; S.zoom=S.cam.k;
    applyCam(); return;
  }
  const p=evDoc(e);
  if(!drag){
    if(S.brush){ S.brushAt={x:p.x,y:p.y}; stage.style.cursor='none'; drawOverlay(); return; }
    const idx=indexFromEvent(e);
    if(idx>=0 && idx!==S.doc.page){ stage.style.cursor=spaceDown?'grab':'default'; if(S.hover){S.hover=null;drawOverlay();} return; }
    const h=hitTest(p.x,p.y); const id=h?h.id:null; if(id!==S.hover){ S.hover=id; drawOverlay(); }
    stage.style.cursor=spaceDown?'grab':S.tool?'crosshair':h?'move':'default'; return;
  }
  const L=drag.L, s=drag.start, dx=p.x-drag.p0.x, dy=p.y-drag.p0.y;
  if(drag.mode==='draw-redact'){
    if(Math.hypot(p.x-drag.p0.x,p.y-drag.p0.y)>3) drag.moved=true;
    L.x=Math.round(Math.min(drag.p0.x,p.x)); L.y=Math.round(Math.min(drag.p0.y,p.y));
    L.w=Math.max(1,Math.round(Math.abs(p.x-drag.p0.x))); L.h=Math.max(1,Math.round(Math.abs(p.y-drag.p0.y)));
  }
  else if(drag.mode==='brush'){
    S.brushAt={x:p.x,y:p.y};
    const loc=layerLocal(L,p.x,p.y).map(v=>Math.round(v*10)/10);
    const pts=drag.stroke.points;
    if(e.shiftKey) drag.stroke.points=[pts[0],loc];
    else { const last=pts[pts.length-1]; if(!last||Math.hypot(loc[0]-last[0],loc[1]-last[1])>=1.5) pts.push(loc); }

  }

    let w=hx? Math.max(8,(px-ax)*hx) : s.w;

    const corner=hx&&hy;
    if(L.type==='text'){
      if(corner){ const f=w/s.w; L.size=Math.max(4,Math.round(s.size*f*10)/10); L.padX=s.padX*f; L.padY=s.padY*f; L.strokeW=s.strokeW*f; h=s.h*f; }

    }

    const ncx=cx0+clx*c-cly*sn, ncy=cy0+clx*sn+cly*c;

    if(L.type!=='text' && !e.altKey && Math.abs(s.rot||0)<0.5){
      const snapped=snapResizeEdges({x,y,w,h,hx,hy,lock,s,k:p.v.k||S.cam.k||1});
      x=snapped.x; y=snapped.y; w=snapped.w; h=snapped.h; S.guides=snapped.guides;

});
function endDrag(){
  if(!drag) return;

    const L=d.L;
    if(!d.moved||L.w<8||L.h<8){ L.w=320; L.h=220; L.x=Math.round(d.p0.x-L.w/2); L.y=Math.round(d.p0.y-L.h/2); }
    S.tool=null; syncRedactTool();
    renderLayers(); renderProps(true); setTab('layer');
  }
  stage.style.cursor=S.brush?'none':spaceDown?'grab':'default';
  if(d.mode==='cam'){
    if(!d.moved && d.clear && S.sel){ S.sel=null; renderLayers(); renderProps(true); scheduleRender(); }
    return;
  }
  commit(); scheduleRender(); syncProps();

stage.addEventListener('pointerup',endDrag); stage.addEventListener('pointercancel',endDrag);
stage.addEventListener('pointerleave',()=>{ if(S.brushAt) S.brushAt=null; if(!drag&&S.hover) S.hover=null; if(!drag) drawOverlay(); });
stage.addEventListener('dblclick',e=>{
  const p=evDoc(e); const hit=hitTest(p.x,p.y); if(!hit) return;

});
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const L=sel();

let wheelT=0;
function enterCrop(){ const L=sel(); if(!L||L.type!=='image'||!L.src) return; if(S.brush||S.tool) exitDrawTools(); if(L.fit==='stretch') L.fit='cover'; S.crop=true; $('#cropbar').hidden=false; scheduleRender(); renderProps(true); }
const HINT_IDLE='Drag empty space or scroll to pan · Ctrl-scroll to zoom · hold Space to pan · pages sit side by side';
function syncRedactTool(){
  const btn=$('#redactBtn'); if(btn){ btn.classList.toggle('on', !!(S.tool||S.brush)); btn.setAttribute('aria-expanded', $('#redactPop')&&!$('#redactPop').hidden ? 'true' : 'false'); }

function addRedactBox(box){

/* ---------- drag & drop ---------- */
let dragDepth=0;
stagewrap.addEventListener('dragenter',e=>{ e.preventDefault(); dragDepth++; $('#dropmask').hidden=false; });

stagewrap.addEventListener('drop',e=>{
  e.preventDefault(); dragDepth=0; $('#dropmask').hidden=true;
  const idx=indexFromEvent(e);
  if(idx>=0 && idx!==S.doc.page){ S.sel=null; S.crop=false; $('#cropbar').hidden=true; S.doc.page=idx; syncArtboards(); renderLayers(); renderProps(true); renderPages(); }
  const p=evDoc(e);

  if(aid){ const a=LIB.find(x=>x.id===aid); if(a) addAsset(a,{x:p.x,y:p.y}); return; }

window.addEventListener('paste',e=>{
  if(isTyping()) return;
  const files=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));
  if(files.length){
    e.preventDefault();
    const L=sel();
    if(L&&L.type==='image'&&(L.slot||!L.src)){ (async()=>{ const f=files[0]; fillSlot(L,await localSrc(f),await blobDims(f)); })(); }
    else handleFiles(files);
    return;
  }
  if(S.clip){ e.preventDefault(); pasteLayer(); }
});
function pasteLayer(){
  let data; try{ data=JSON.parse(S.clip); }catch(e){ return; }
  const list=Array.isArray(data)?data:[data];
  if(!list.length) return;
  const map={}; list.forEach(l=>{ map[l.id]=uid(); });
  const clones=list.map(src=>{
    const c=JSON.parse(JSON.stringify(src));
    c.id=map[src.id]||uid();
    if(c.parent&&map[c.parent]) c.parent=map[c.parent];
    c.x=(c.x||0)+24; c.y=(c.y||0)+24; c.locked=false;
    return c;
  });
  S.doc.layers.push(...clones); S.sel=clones[0].id;

/* ---------- keyboard ---------- */
const isTyping=()=>{ const a=document.activeElement; return a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'||a.isContentEditable); };
window.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey;
  if(mod && e.key.toLowerCase()==='z' && !isTyping()){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if(mod && e.key.toLowerCase()==='y' && !isTyping()){ e.preventDefault(); redo(); return; }
  if(isTyping()) { if(e.key==='Escape') document.activeElement.blur(); return; }
  if($('#modalRoot').firstChild) { if(e.key==='Escape') closeModal(); return; }
  if(e.code==='Space'){ e.preventDefault(); if(!spaceDown){ spaceDown=true; if(!drag) stage.style.cursor='grab'; } return; }
  const L=sel();
  if(e.key==='Escape'){ if(S.brush||S.tool){ exitDrawTools(); return; } if(S.crop) exitCrop(); else if(S.sel){ S.sel=null; renderLayers(); renderProps(true); scheduleRender(); } return; }
  if(e.key==='Enter' && S.brush){ e.preventDefault(); exitDrawTools(); return; }
  if(mod && e.key.toLowerCase()==='c' && L){ S.clip=JSON.stringify(collectBranch(L.id).map(id=>S.doc.layers.find(l=>l.id===id))); toast(L.type==='folder'?'Folder copied':'Layer copied'); return; }
  if(mod && e.key.toLowerCase()==='d' && L){ e.preventDefault(); act('dup'); return; }
  if(mod && e.key.toLowerCase()==='s'){ e.preventDefault(); openSaveTemplate(); return; }
  if(mod && e.key.toLowerCase()==='e'){ e.preventDefault(); openExport(); return; }
  if(!mod && !e.repeat && e.key.toLowerCase()==='t'){ addText(); return; }
  if(!mod && !e.repeat && e.key.toLowerCase()==='r'){ e.preventDefault(); addRedactBox(); return; }
  if(!mod && !e.repeat && e.key.toLowerCase()==='b'){ const cur=sel(); if(cur&&cur.type==='redact'){ e.preventDefault(); S.brush?exitDrawTools():enterBrush(false); return; } }
  if(!L) return;
  if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); act('del'); return; }
  if(e.key===']'){ act(e.shiftKey?'front':'fwd'); return; }
  if(e.key==='['){ act(e.shiftKey?'bottom':'back'); return; }
  if(e.key==='Enter' && L.type==='image' && L.src){ S.crop?exitCrop():enterCrop(); return; }
  const n=e.shiftKey?10:1, mv={ArrowLeft:[-n,0],ArrowRight:[n,0],ArrowUp:[0,-n],ArrowDown:[0,n]}[e.key];
  if(mv && !layerLocked(L) && L.type!=='folder'){ e.preventDefault(); L.x+=mv[0]; L.y+=mv[1]; scheduleRender(); syncProps(); clearTimeout(nudgeT); nudgeT=setTimeout(commit,250); }
});
window.addEventListener('keyup',e=>{ if(e.code==='Space'){ spaceDown=false; if(!drag) stage.style.cursor='default'; } });
let nudgeT=0;

/* ---------- pages and folders ---------- */
function collectBranch(id){
  const ids=[id], ls=S.doc.layers;
  for(let i=0;i<ids.length;i++){
    for(const L of ls) if(L.parent===ids[i] && !ids.includes(L.id)) ids.push(L.id);
  }
  return ids;
}
function holds(id,nodeId){
  if(id===nodeId) return true;
  const ls=S.doc.layers;
  let n=0, cur=ls.find(l=>l.id===nodeId);
  while(cur && cur.parent && n++<24){
    if(cur.parent===id) return true;
    cur=ls.find(l=>l.id===cur.parent);
  }
  return false;
}
function removeBranch(id){
  const ids=new Set(collectBranch(id));
  S.doc.layers=S.doc.layers.filter(L=>!ids.has(L.id));
}
function duplicateBranch(id){
  const ids=collectBranch(id), map={};
  ids.forEach(old=>{ map[old]=uid(); });
  const clones=ids.map(old=>{
    const src=S.doc.layers.find(l=>l.id===old);
    const c=JSON.parse(JSON.stringify(src));
    c.id=map[old];
    if(c.parent&&map[c.parent]) c.parent=map[c.parent];
    c.x=(c.x||0)+24; c.y=(c.y||0)+24; c.locked=false;
    return c;
  });
  const i=S.doc.layers.findIndex(l=>l.id===id);
  S.doc.layers.splice(i+1,0,...clones);
  S.sel=map[id];
  commit(); scheduleRender(); renderLayers(); renderProps(true);
}
function addFolder(){
  const cur=sel();
  const folder=Object.assign(BASE(),{type:'folder',name:'Folder',open:true,parent:cur&&cur.type==='folder'?cur.id:(cur?cur.parent||null:null)});
  S.doc.layers.push(folder);
  if(cur && cur.type!=='folder') cur.parent=folder.id;
  S.sel=folder.id;
  commit(); scheduleRender(); renderLayers(); renderProps(true);
}
function addPage(keepPhotos){
  const cur=S.doc.pages[S.doc.page];
  const page=JSON.parse(JSON.stringify(cur));
  page.id=uid();
  page.name='Page '+(S.doc.pages.length+1);
  const map={};
  page.layers.forEach(l=>{ const n=uid(); map[l.id]=n; l.id=n; });
  page.layers.forEach(l=>{
    if(l.parent) l.parent=map[l.parent]||null;
    if(!keepPhotos && l.type==='image' && l.slot) l.src=null;
  });
  S.doc.pages.push(page);
  S.doc.page=S.doc.pages.length-1;
  S.sel=null; S.crop=false; $('#cropbar').hidden=true;
  commit(); afterLoad(false);
  if(S.zoom!=='fit') framePage(S.doc.page);
}
function deletePage(){
  if(S.doc.pages.length<2) return;
  S.doc.pages.splice(S.doc.page,1);
  S.doc.page=Math.min(S.doc.page,S.doc.pages.length-1);
  S.sel=null; S.crop=false; $('#cropbar').hidden=true;
  commit(); afterLoad(false);
}
function goPage(i){
  i=+i;
  if(!Number.isInteger(i)||i===S.doc.page||i<0||i>=S.doc.pages.length) return;
  S.sel=null; S.crop=false; $('#cropbar').hidden=true;
  S.doc.page=i;
  layoutPages(); syncArtboards(); renderLayers(); renderPages(); renderProps(true);
  framePage(i); scheduleRender();
}
let pageT=0;
function touchPages(){ clearTimeout(pageT); pageT=setTimeout(renderPages,180); }
function renderPages(){
  const box=$('#pages'); if(!box||!S.doc) return;
  const pages=S.doc.pages;
  box.innerHTML=pages.map((p,i)=>`<button type="button" class="pg ${i===S.doc.page?'on':''}" data-page="${i}" title="${esc(p.name)}">
      <canvas width="44" height="${Math.max(1,Math.round(44*p.h/p.w))}" data-pgc="${i}"></canvas><span>${i+1}</span></button>`).join('')+
    `<button type="button" class="pgadd" data-act="add-page">+ Page</button>`+
    `<button type="button" class="pgadd" data-act="dup-page">Duplicate</button>`+
    (pages.length>1?`<button type="button" class="pgadd" data-act="del-page">Remove</button>`:'');
  pages.forEach((p,i)=>{

  });
}
$('#pages').addEventListener('click',e=>{ const b=e.target.closest('[data-page]'); if(b) goPage(b.dataset.page); });

/* ---------- actions ---------- */
function act(a,el){
  const L=sel(), ls=S.doc.layers, i=L?ls.indexOf(L):-1;
  switch(a){
    case 'add-text': addText(); break;
    case 'add-image': $('#fileImg').click(); break;
    case 'undo': undo(); break; case 'redo': redo(); break;
    case 'zoom-in': zoomBy(1.25); break; case 'zoom-out': zoomBy(.8); break;
    case 'zoom-fit': S.zoom='fit'; fitView(); break;
    case 'crop-done': exitCrop(); break;
    case 'crop': S.crop?exitCrop():enterCrop(); break;
    case 'new': openNew(); break;
    case 'import-psd': closeModal(); $('#filePsd').click(); break;
    case 'save-tpl': openSaveTemplate(); break;
    case 'export': openExport(); break;
    case 'brush-done': exitDrawTools(); break;
    case 'dup': if(L) duplicateBranch(L.id); break;
    case 'del': if(L){ removeBranch(L.id); S.sel=null; S.crop=false; $('#cropbar').hidden=true; if(S.brush||S.tool) exitDrawTools(); commit(); scheduleRender(); renderLayers(); renderProps(true);} break;
    case 'add-folder': addFolder(); break;
    case 'add-page': addPage(false); break;
    case 'dup-page': addPage(true); break;
    case 'del-page': deletePage(); break;
    case 'fwd': if(L&&i<ls.length-1){ ls.splice(i,1); ls.splice(i+1,0,L); commit(); scheduleRender(); renderLayers(); } break;
    case 'back': if(L&&i>0){ ls.splice(i,1); ls.splice(i-1,0,L); commit(); scheduleRender(); renderLayers(); } break;
    case 'front': if(L){ ls.splice(i,1); ls.push(L); commit(); scheduleRender(); renderLayers(); } break;
    case 'bottom': if(L){ ls.splice(i,1); ls.unshift(L); commit(); scheduleRender(); renderLayers(); } break;
    case 'al-l': case 'al-c': case 'al-r': case 'al-t': case 'al-m': case 'al-b':
      if(L){ const W=S.doc.w,H=S.doc.h; if(a==='al-l') L.x=0; if(a==='al-c') L.x=Math.round(W/2-L.w/2); if(a==='al-r') L.x=W-L.w; if(a==='al-t') L.y=0; if(a==='al-m') L.y=Math.round(H/2-L.h/2); if(a==='al-b') L.y=H-L.h; commit(); scheduleRender(); syncProps(); } break;
    case 'flipx': if(L){ L.flipX=!L.flipX; commit(); scheduleRender(); renderProps(true);} break;
    case 'flipy': if(L){ L.flipY=!L.flipY; commit(); scheduleRender(); renderProps(true);} break;
    case 'reset-fx': if(L){ Object.assign(L,{bright:100,contrast:100,sat:100,gray:0,blur:0}); commit(); scheduleRender(); renderProps(true);} break;
    case 'clear-img': if(L){ L.src=null; commit(); scheduleRender(); renderProps(true); renderLayers(); } break;
    case 'replace-img': pendingSlot=el?.dataset.id||S.sel; $('#fileSlot').click(); break;
    case 'reseed': if(L){ L.seed=1+Math.floor(Math.random()*9999); commit(); scheduleRender(); } break;
    case 'natural': if(L&&L.type==='image'&&L.nw){ const cx=L.x+L.w/2, cy=L.y+L.h/2; const r=L.nw/L.nh; L.h=Math.round(L.w/r); L.x=Math.round(cx-L.w/2); L.y=Math.round(cy-L.h/2); L.fit='stretch'; commit(); scheduleRender(); renderProps(true);} break;
    case 'save-swatch': saveSwatch(el.dataset.for); break;
  }
}

function layerRows(){
  const ls=S.doc.layers;
  const isFolder=id=>ls.some(l=>l.id===id&&l.type==='folder');
  const kids=id=>ls.filter(l=>l.parent===id);
  const roots=ls.filter(l=>!l.parent||!isFolder(l.parent));
  const rows=[];
  const walk=(list,depth)=>{
    [...list].reverse().forEach(L=>{
      rows.push({L,depth});
      if(L.type==='folder'&&L.open!==false) walk(kids(L.id),depth+1);
    });
  };
  walk(roots,0);
  return rows;
}

function slotBrief(L){

async function draftFromExcerpt(){
  const text=EX.text.trim();
  if(text.length<40){ EX.msg='Paste a longer excerpt: a few sentences at least.'; EX.err=true; renderProps(true); return; }
  const slots=S.doc.layers.filter(l=>l.slot&&l.type==='text');
  const briefs=slots.map(slotBrief);
  EX.busy=true; EX.msg=''; EX.err=false; EX.ctrl=new AbortController(); renderProps(true);
  try{
    const out=await cap.sample.draft({excerpt:text.slice(0,12000),slots:briefs},EX.ctrl.signal);
    const f=(out&&out.fields)||{}; const filled=[];
    for(const L of slots){ const v=f[L.slot]; if(typeof v==='string'&&v.trim()){ L.text=v.trim(); filled.push(L); } }
    const n=filled.length; let tight=[];
    if(n){
      await ensureFonts(filled);
      tight=fitFilledText(filled,S.doc.layers,S.doc.w,S.doc.h);
      await ensureFonts(filled);
      commit(); scheduleRender(); renderLayers();
    }
    EX.msg=n?`Filled ${n} of ${slots.length} slots.`+tightNote(tight)+(out.notes?` <b>Note:</b> ${esc(out.notes)}`:'')+' Fix anything with the boxes below, or undo with Ctrl+Z.':'The excerpt didn\'t have enough to fill the slots.';

    EX.err=true;

      err?.code==='rate_limited' ? 'Too many drafts at once. Wait a minute and try again.' :
      err?.code==='not_configured' ? 'Drafting isn\'t set up on the server yet (missing ANTHROPIC_API_KEY).' :
      err?.code==='invalid_json' ? 'Claude\'s answer came back malformed. Try again.' :

  EX.busy=false; EX.ctrl=null; renderProps(true);
}

function psRound(n){ return Math.round(n*100)/100; }
function applyFromPhotoshop(){
  const L=sel(); if(!L||L.type!=='text') return;
  const size=parseFloat($('#ps-size').value);
  if(!(size>0)){ toast('Enter a size in pixels.',true); return; }
  const leadRaw=($('#ps-lead').value||'').trim();
  let lh=1.2;
  if(leadRaw && !/^auto$/i.test(leadRaw)){
    const lead=parseFloat(leadRaw);
    if(!(lead>0)){ toast('Leading needs a pixel value, or Auto.',true); return; }
    lh=lead/size;
  }
  const trackRaw=($('#ps-track').value||'').trim();
  const track=trackRaw===''?0:parseFloat(trackRaw);
  if(!isFinite(track)){ toast('Tracking needs a number.',true); return; }
  const hsRaw=($('#ps-hscale').value||'').trim();
  const hs=hsRaw===''?100:parseFloat(hsRaw);
  if(!(hs>0)){ toast('Horizontal scale needs a percent.',true); return; }
  L.size=size; L.lh=lh; L.ls=track*size/1000; L.hscale=hs/100;
  if(BRAND_FONT_FAMILIES.has(L.font)){ L.weight=400; L.italic=false; }
  commit(); ensureFonts([L]); scheduleRender(); syncProps(true);
}
function fieldVal(L,p){
  if(p==='_slot') return !!L.slot;
  if(p==='_w') return S.doc.w; if(p==='_h') return S.doc.h; if(p==='_bg') return S.doc.bg;
  if(p==='_size') return S.doc.w+'x'+S.doc.h;
  return L?L[p]:undefined;
}
function syncProps(force){
  const box=$('#props'); const L=sel();
  box.querySelectorAll('[data-p]').forEach(el=>{
    if(!force && el===document.activeElement) return;
    const p=el.dataset.p, t=el.dataset.t; const isDoc=p.startsWith('_')&&p!=='_slot';
    if(!isDoc && !L) return;
    let v=fieldVal(isDoc?null:L,p);
    if(t==='bool') el.checked=!!v;
    else if(t==='pct') el.value=Math.round((v??1)*100);
    else if(t==='color'){ el.value=/^#[0-9a-f]{6}$/i.test(v)?v:'#000000'; }
    else if(t==='num'){ el.value= typeof v==='number'? Math.round(v*100)/100 : (v??''); }
    else if(el.tagName==='SELECT'){ el.value = v??''; if(p==='_size' && el.selectedIndex<0) el.value=''; }
    else el.value=v??'';
    const o=box.querySelector(`[data-o="${p}"]`); if(o) o.textContent=fmtOut(p,v);
  });
  box.querySelectorAll('[data-seg]').forEach(s=>{ const p=s.dataset.seg; s.querySelectorAll('[data-segv]').forEach(b=>b.setAttribute('aria-pressed',L&&String(L[p])===b.dataset.segv)); });
}
function fmtOut(p,v){ if(p==='hscale'||p==='zoom') return Math.round(v*100)+'%'; if(p==='fill2Alpha') return Math.round(v*100)+'%'; if(['bright','contrast','sat','gray'].includes(p)) return Math.round(v)+'%'; if(p==='gradAngle') return Math.round(v)+'°'; return String(Math.round(v*10)/10); }
const REBUILD=new Set(['bg','grad','strokeW','shadow','fit','_slot','font','slot','mode','shape']);
function applyField(el,isChange){
  const p=el.dataset.p, t=el.dataset.t; let v;
  if(t==='bool') v=el.checked; else if(t==='num'||t==='pct'){ v=parseFloat(el.value); if(isNaN(v)) return; if(t==='pct') v=clamp(v/100,0,1); }
  else if(t==='hex'){ v=el.value.trim(); if(!v.startsWith('#')) v='#'+v; if(!/^#[0-9a-f]{6}$/i.test(v)) return; v=v.toUpperCase(); }
  else if(t==='color') v=el.value.toUpperCase(); else v=el.value;
  if(p==='_w'||p==='_h'){ S.doc[p==='_w'?'w':'h']=clamp(Math.round(v),100,4000); if(isChange){ fitView(); renderProps(true);} scheduleRender(); return; }
  if(p==='_bg'){ S.doc.bg=v; scheduleRender(); return; }
  if(p==='_size'){ if(v){ const [w,h]=v.split('x').map(Number); S.doc.w=w; S.doc.h=h; scheduleRender(); fitView(); renderProps(true);} return; }
  const L=sel(); if(!L) return;
  if(p==='_slot'){ L.slot = v ? (L.slot || L.name || (L.type==='image'?'Photo':layerLabel(L).slice(0,18))) : ''; }
  else if(p==='font'){ L.font=v; const f=allFonts().find(x=>x.family===v); if(BRAND_FONT_FAMILIES.has(v)){ L.weight=400; L.italic=false; } else if(f&&!f.weights.includes(L.weight)) L.weight=f.weights.reduce((a,b)=>Math.abs(b-L.weight)<Math.abs(a-L.weight)?b:a); ensureFonts([L]); }
  else L[p]=v;
  if(L.type==='redact'){ L.web=true; if(p==='block') L.block=Math.max(12,Math.round(+L.block||28)); if(p==='blurRadius') L.blurRadius=Math.max(1,Math.round(+L.blurRadius||24)); }
  if(BRAND_FONT_FAMILIES.has(L.font)){ L.weight=400; L.italic=false; if(isChange && p==='weight') el.value=400; }
  if(p==='weight'||p==='italic'||p==='size') ensureFonts([L]);
  if(p==='text' && L.slot){ const f=$(`[data-fill="${L.id}"]`); if(f&&f!==document.activeElement) f.value=L.text; }
  scheduleRender();
  if(t==='color'||t==='hex'){ const other=$('#props').querySelector(`[data-p="${p}"][data-t="${t==='color'?'hex':'color'}"]`); if(other) other.value=v; }
  const o=$('#props').querySelector(`[data-o="${p}"]`); if(o) o.textContent=fmtOut(p,v);
  if(p==='name'||p==='slot'||p==='_slot'||p==='text'||p==='web') renderLayers();
  if(isChange && REBUILD.has(p)) renderProps(true);
}
const props=$('#props');
props.addEventListener('input',e=>{

function refreshFillThumbs(){

function thumbData(doc,maxW=300){

}

/* ---------- export ---------- */
async function renderPageBlob(page,fmt,q,scale){
  const mul=scale===2?2:1;
  await allImagesReady(page); await ensureFonts(page.layers);
  const c=document.createElement('canvas'); c.width=Math.round(page.w*mul); c.height=Math.round(page.h*mul);
  renderDoc(c.getContext('2d'),page,{editor:false,scale:mul});
  const mime={png:'image/png',jpg:'image/jpeg',webp:'image/webp'}[fmt];
  return await new Promise((res,rej)=>{ try{ c.toBlob(b=>b?res(b):rej(new Error('blank')),mime,q); }catch(e){ rej(e); } });
}
async function renderBlob(fmt,q,scale){ return renderPageBlob(S.doc.pages[S.doc.page],fmt,q,scale); }
async function renderWebBlob(page){
  await allImagesReady(page); await ensureFonts(page.layers);
  const c=document.createElement('canvas'); c.width=page.w; c.height=page.h;
  renderWeb(c.getContext('2d'),page,{scale:1});
  const blob=await new Promise((res,rej)=>{ try{ c.toBlob(b=>b?res(b):rej(new Error('blank')),'image/webp',0.9); }catch(e){ rej(e); } });
  if(blob.type==='image/webp') return {blob,ext:'webp'};
  const png=await new Promise((res,rej)=>{ try{ c.toBlob(b=>b?res(b):rej(new Error('blank')),'image/png'); }catch(e){ rej(e); } });
  return {blob:png,ext:'png'};
}
function webBlockMessage(issue){
  const names=issue.blocked.map(n=>'“'+n+'”').join(', ');
  return names+' must sit on top of a photo that is included in the website image.';
}
function webEmptyMessage(){ return 'Nothing is included in the website image, so that file was not saved.'; }
function slotText(...keys){ const L=S.doc.layers.find(l=>l.type==='text'&&l.slot&&keys.some(k=>l.slot.toLowerCase().includes(k))); return L?String(L.upper?L.text.toUpperCase():L.text).replace(/\s*\n\s*/g,' ').trim():''; }
function defaultName(){ return slug(slotText('headline','title')||S.doc.name); }
async function saveFile(filename,data){
  if(!cap.downloads) return false;
  try{ await cap.downloads.save({filename,data}); return true; }
  catch(err){ if(err?.code==='declined') { toast('Download cancelled'); return 'declined'; } throw err; }
}
function hiddenRedactions(){
  return S.doc.pages.some(p=>(p.layers||[]).some(L=>{
    if(L.type!=='redact') return false;
    if(L.visible===false) return true;
    let id=L.parent, n=0;
    while(id&&n++<24){
      const parent=p.layers.find(x=>x.id===id);
      if(!parent) return false;
      if(parent.visible===false) return true;
      id=parent.parent;
    }
    return false;
  }));
}
